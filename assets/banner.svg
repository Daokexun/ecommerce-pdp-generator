<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="50%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#heroBg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="80" r="280" fill="#6366f1" opacity="0.12" filter="blur(60px)"/>
  <circle cx="350" cy="180" r="200" fill="#06b6d4" opacity="0.08" filter="blur(50px)"/>
  <circle cx="850" cy="180" r="200" fill="#a855f7" opacity="0.08" filter="blur(50px)"/>

  <!-- Subtle Grid -->
  <g opacity="0.06">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M200,0 V320 M400,0 V320 M600,0 V320 M800,0 V320 M1000,0 V320" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Main Content Centered -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Badge -->
    <rect x="-125" y="-12" width="250" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="-105" cy="1" r="3.5" fill="#10b981"/>
    <text x="-94" y="5" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="start">AUTONOMOUS PDP ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="54" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-1">E-Commerce PDP Studio</text>

    <!-- Subtitle -->
    <text x="0" y="90" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="-0.2">
      Turn raw specifications &amp; customer reviews into high-converting, platform-compliant listings.
    </text>

    <!-- Platform Tags -->
    <g transform="translate(0, 130)">
      <!-- Tag 1 -->
      <rect x="-240" y="0" width="105" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="-187" y="18" fill="#e2e8f0" font-size="11" font-weight="600">Shopify DTC</text>

      <!-- Tag 2 -->
      <rect x="-120" y="0" width="140" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="-50" y="18" fill="#e2e8f0" font-size="11" font-weight="600">Amazon A9/COSMO</text>

      <!-- Tag 3 -->
      <rect x="35" y="0" width="105" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="87" y="18" fill="#e2e8f0" font-size="11" font-weight="600">TikTok Shop</text>

      <!-- Tag 4 -->
      <rect x="155" y="0" width="95" height="28" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="202" y="18" fill="#a5b4fc" font-size="11" font-weight="600">Agent Skill</text>
    </g>
  </g>
</svg>
