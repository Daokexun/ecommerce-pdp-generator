<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradZh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    
    <linearGradient id="cardGradZh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c1220" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cyanLineZh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="emeraldLineZh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="indigoLineZh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="cardShadowZh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowCyanZh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmeraldZh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981" />
    </marker>
    <marker id="arrowIndigoZh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#6366f1" />
    </marker>
    <marker id="arrowRoseZh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGradZh)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200 M0,360 H1200 M0,420 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M100,0 V480 M200,0 V480 M300,0 V480 M400,0 V480 M500,0 V480 M600,0 V480 M700,0 V480 M800,0 V480 M900,0 V480 M1000,0 V480 M1100,0 V480" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 48)">
    <circle cx="6" cy="6" r="4" fill="#10b981"/>
    <text x="20" y="10" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">核心工作流规范</text>
    <text x="0" y="32" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.5">高转化产品详情页（PDP）四步生成架构</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 310 240 L 340 240" fill="none" stroke="url(#cyanLineZh)" stroke-width="2" marker-end="url(#arrowCyanZh)"/>
  <path d="M 590 240 L 620 240" fill="none" stroke="url(#emeraldLineZh)" stroke-width="2" marker-end="url(#arrowEmeraldZh)"/>
  <path d="M 870 240 L 900 240" fill="none" stroke="url(#indigoLineZh)" stroke-width="2" marker-end="url(#arrowIndigoZh)"/>

  <!-- Feedback Loop -->
  <path d="M 1030 380 L 1030 420 L 750 420 L 750 380" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRoseZh)"/>
  <rect x="820" y="410" width="150" height="20" rx="4" fill="#181324" stroke="#f43f5e" stroke-width="1"/>
  <text x="895" y="424" fill="#fda4af" font-size="11" font-weight="600" text-anchor="middle">评分 &lt; 85 分: 自动回溯重写</text>

  <!-- ==================== 卡片 1 ==================== -->
  <g transform="translate(60, 110)">
    <rect width="250" height="270" rx="12" fill="url(#cardGradZh)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowZh)"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#06b6d4"/>
    
    <rect x="18" y="20" width="28" height="28" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="32" y="38" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">01</text>
    <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">竞品与用户心声挖掘</text>
    <text x="56" y="46" fill="#64748b" font-size="11">从真实反馈里找买单理由</text>

    <line x1="18" y1="62" x2="232" y2="62" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(18, 82)">
      <circle cx="4" cy="4" r="2.5" fill="#06b6d4"/>
      <text x="14" y="8" fill="#e2e8f0" font-size="12" font-weight="600">差评挖痛点，好评挖核心价值</text>
      <text x="14" y="22" fill="#94a3b8" font-size="11">提取竞品1-2星差评与5星夸奖</text>

      <circle cx="4" cy="46" r="2.5" fill="#06b6d4"/>
      <text x="14" y="50" fill="#e2e8f0" font-size="12" font-weight="600">售前问答 (QA) 排雷</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">找出用户下单前犹豫的最大顾虑</text>

      <circle cx="4" cy="88" r="2.5" fill="#06b6d4"/>
      <text x="14" y="92" fill="#e2e8f0" font-size="12" font-weight="600">三维待办任务分析 (JTBD)</text>
      <text x="14" y="106" fill="#94a3b8" font-size="11">搞清楚用户实际买来帮他解决啥</text>

      <circle cx="4" cy="130" r="2.5" fill="#06b6d4"/>
      <text x="14" y="134" fill="#e2e8f0" font-size="12" font-weight="600">痛点严峻度评级 (1-5)</text>
      <text x="14" y="148" fill="#94a3b8" font-size="11">区分致命退货点与普通体验痒点</text>
    </g>
  </g>

  <!-- ==================== 卡片 2 ==================== -->
  <g transform="translate(340, 110)">
    <rect width="250" height="270" rx="12" fill="url(#cardGradZh)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowZh)"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#10b981"/>

    <rect x="18" y="20" width="28" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="38" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">02</text>
    <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">卖点提炼与参数转化</text>
    <text x="56" y="46" fill="#64748b" font-size="11">拒绝自嗨，参数全变生活好处</text>

    <line x1="18" y1="62" x2="232" y2="62" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(18, 82)">
      <circle cx="4" cy="4" r="2.5" fill="#10b981"/>
      <text x="14" y="8" fill="#e2e8f0" font-size="12" font-weight="600">参数转好处 (P2B 法则)</text>
      <text x="14" y="22" fill="#94a3b8" font-size="11">参数 ➔ 背后原理 ➔ 实际省心省钱</text>

      <circle cx="4" cy="46" r="2.5" fill="#10b981"/>
      <text x="14" y="50" fill="#e2e8f0" font-size="12" font-weight="600">黄金排序法则 (层次分明)</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">人无我有 ＞ 人有我优 ＞ 人优我异</text>

      <circle cx="4" cy="88" r="2.5" fill="#10b981"/>
      <text x="14" y="92" fill="#e2e8f0" font-size="12" font-weight="600">首屏独占壁垒置顶</text>
      <text x="14" y="106" fill="#94a3b8" font-size="11">第一屏只放竞品做不到的最大杀手锏</text>

      <circle cx="4" cy="130" r="2.5" fill="#10b981"/>
      <text x="14" y="134" fill="#e2e8f0" font-size="12" font-weight="600">损失厌恶唤醒</text>
      <text x="14" y="148" fill="#94a3b8" font-size="11">说清楚不用会每天承受的麻烦与尴尬</text>
    </g>
  </g>

  <!-- ==================== 卡片 3 ==================== -->
  <g transform="translate(620, 110)">
    <rect width="250" height="270" rx="12" fill="url(#cardGradZh)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowZh)"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#6366f1"/>

    <rect x="18" y="20" width="28" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="38" fill="#818cf8" font-size="13" font-weight="700" text-anchor="middle">03</text>
    <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">平台文案定制工厂</text>
    <text x="56" y="46" fill="#64748b" font-size="11">符合算法规则的高转化模块</text>

    <line x1="18" y1="62" x2="232" y2="62" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(18, 82)">
      <circle cx="4" cy="4" r="2.5" fill="#6366f1"/>
      <text x="14" y="8" fill="#e2e8f0" font-size="12" font-weight="600">亚马逊 A9 算法规范</text>
      <text x="14" y="22" fill="#94a3b8" font-size="11">&lt;200字符前置大词, 五点大写利益</text>

      <circle cx="4" cy="46" r="2.5" fill="#6366f1"/>
      <text x="14" y="50" fill="#e2e8f0" font-size="12" font-weight="600">独立站 AIDA 滚屏漏斗</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">首屏3秒钩子, 沉浸式图文叙事</text>

      <circle cx="4" cy="88" r="2.5" fill="#6366f1"/>
      <text x="14" y="92" fill="#e2e8f0" font-size="12" font-weight="600">六大攻防文案模块</text>
      <text x="14" y="106" fill="#94a3b8" font-size="11">痛点镜、对冲阵、场景群、促单CTA</text>

      <circle cx="4" cy="130" r="2.5" fill="#6366f1"/>
      <text x="14" y="134" fill="#e2e8f0" font-size="12" font-weight="600">电商摄影分镜提示词</text>
      <text x="14" y="148" fill="#94a3b8" font-size="11">为Midjourney/Flux设计带排版留白分镜</text>
    </g>
  </g>

  <!-- ==================== 卡片 4 ==================== -->
  <g transform="translate(900, 110)">
    <rect width="240" height="270" rx="12" fill="url(#cardGradZh)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadowZh)"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#f43f5e"/>

    <rect x="18" y="20" width="28" height="28" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
    <text x="32" y="38" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">04</text>
    <text x="56" y="32" fill="#f8fafc" font-size="14" font-weight="700">挑剔买家挑刺与风控</text>
    <text x="56" y="46" fill="#64748b" font-size="11">红蓝对抗把关，杜绝违规</text>

    <line x1="18" y1="62" x2="222" y2="62" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(18, 82)">
      <circle cx="4" cy="4" r="2.5" fill="#f43f5e"/>
      <text x="14" y="8" fill="#e2e8f0" font-size="12" font-weight="600">挑剔买家角色无情质询</text>
      <text x="14" y="22" fill="#94a3b8" font-size="11">专挑假大空与不信任的隐性担忧</text>

      <circle cx="4" cy="46" r="2.5" fill="#f43f5e"/>
      <text x="14" y="50" fill="#e2e8f0" font-size="12" font-weight="600">平台封店合规风控排查</text>
      <text x="14" y="64" fill="#94a3b8" font-size="11">严格剔除绝对化宣传与医疗暗示</text>

      <circle cx="4" cy="88" r="2.5" fill="#10b981"/>
      <text x="14" y="92" fill="#e2e8f0" font-size="12" font-weight="600">100 分转化量化打分</text>
      <text x="14" y="106" fill="#94a3b8" font-size="11">从拦截力、收益感知、信任多维打分</text>

      <rect x="14" y="128" width="130" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="79" y="144" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">评分 &gt;= 85 分 ➔ 定稿交付</text>
    </g>
  </g>
</svg>
