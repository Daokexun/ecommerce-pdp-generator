<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="heroBgZh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="50%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="textGradZh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#heroBgZh)"/>

  <!-- Ambient Glow -->
  <circle cx="600" cy="80" r="280" fill="#6366f1" opacity="0.12" filter="blur(60px)"/>
  <circle cx="350" cy="180" r="200" fill="#06b6d4" opacity="0.08" filter="blur(50px)"/>
  <circle cx="850" cy="180" r="200" fill="#a855f7" opacity="0.08" filter="blur(50px)"/>

  <!-- Subtle Grid -->
  <g opacity="0.06">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M200,0 V320 M400,0 V320 M600,0 V320 M800,0 V320 M1000,0 V320" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Content Centered -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Top Pill -->
    <rect x="-135" y="-12" width="270" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="-115" cy="1" r="3.5" fill="#10b981"/>
    <text x="-104" y="5" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="start">电商高转化详情页生成引擎</text>

    <!-- Main Title -->
    <text x="0" y="54" fill="url(#textGradZh)" font-size="42" font-weight="800" letter-spacing="-0.5">电商高转化详情页（PDP）生成器</text>

    <!-- Subtitle -->
    <text x="0" y="90" fill="#94a3b8" font-size="16" font-weight="400">
      告别自嗨式参数堆砌与假大空套话，用真实用户痛点与黄金卖点法则重构详情页
    </text>

    <!-- Platform Tags -->
    <g transform="translate(0, 130)">
      <rect x="-240" y="0" width="110" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="-185" y="18" fill="#e2e8f0" font-size="11" font-weight="600">Shopify 独立站</text>

      <rect x="-115" y="0" width="145" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="-42" y="18" fill="#e2e8f0" font-size="11" font-weight="600">亚马逊 A9 算法优化</text>

      <rect x="45" y="0" width="100" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="95" y="18" fill="#e2e8f0" font-size="11" font-weight="600">TikTok 爆款</text>

      <rect x="160" y="0" width="105" height="28" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="212" y="18" fill="#a5b4fc" font-size="11" font-weight="600">Agent 开箱即用</text>
    </g>
  </g>
</svg>
